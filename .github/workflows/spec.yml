# 要件・設計判断（docs/spec）とコードのタグを突き合わせる（決まりは docs/README.md）。
# ID の重複、ない ID を指すタグ、タグのない要件、切れたリンク、ないファイルの名前があれば失敗する。
# PR では --diff で、タグのあるコードを変えたのに spec を直していないことも見る
# （PR の本文に「Spec-Impact: なし（理由）」があれば通す）。
name: spec
on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          # --diff で base との merge-base が要る
          fetch-depth: 0
      # ubuntu-latest の python3（標準ライブラリだけを使う）
      - name: Check spec and tags
        run: python3 scripts/check-spec.py --summary
      # 確かめ方: REQ-COM-062
      # 訳の漏れ（17 言語のプロンプトと UI の文字列。手順は .claude/skills/i18n/SKILL.md）
      - name: Check translations
        run: python3 scripts/check-i18n.py --summary
      # 確かめ方: REQ-REL-006
      # リリースの本文の組み立て（リリースのときに初めて動くので、ここで毎回確かめる）
      - name: Check release notes composer
        run: python3 scripts/compose-release-notes.py --self-test
      # 設計判断: DEC-COM-170
      # UI のテスト項目（common/testdata/ui）の形・要件との対応・生成した一覧が最新か。描画と判定は CI ではしない
      - name: Check UI test cases
        run: python3 scripts/ui-cases.py check --summary
      # 確かめ方: REQ-COM-194
      # 「AI アプリにつなぐ」の共有のテストデータで、Hanasu が書く config.toml（期待する出力）が TOML として読めるか（DEC-COM-201）
      - name: Check connect test data
        run: |
          python3 - <<'PY'
          import json, tomllib
          cases = json.load(open("common/testdata/connect/cases.json", encoding="utf-8"))["cases"]
          count = 0
          for case in cases:
              after = case.get("expect", {}).get("after")
              if case["kind"] == "toml" and isinstance(after, str):
                  tomllib.loads(after.removeprefix("\ufeff"))
                  count += 1
          print(f"{count} 件の config.toml を TOML として読めた")
          PY
      - name: Check spec against the diff
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_REF: ${{ github.base_ref }}
        run: python3 scripts/check-spec.py --summary --diff "origin/${BASE_REF}"
