# Mac 版（Sources/Hanasu）のビルドと、自己テストの CLI。
# Mac 版を触る PR と、main への push で動く（以前は PR で Mac 版をビルドせず、リリースで初めてコンパイルエラーが見つかった）。
# テストのターゲットがないので、マイク・キーチェーンなどの許可が要らない `--test-…` だけを走らせる。
name: mac
on:
  pull_request:
    paths:
      - "Sources/**"
      - "Package.swift"
      - "Package.resolved"
      - "common/testdata/logic/**"
      - ".github/workflows/mac.yml"
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mac-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Debug build
        shell: bash
        run: |
          swift --version
          # 失敗したときは、末尾だけでなくエラーの行も出す（並べてコンパイルするので、エラーは末尾 40 行より前に出ることがある）
          if ! swift build > build.log 2>&1; then
            grep -n -B2 -A8 'error:' build.log | head -300
            tail -40 build.log
            exit 1
          fi
          tail -40 build.log

      - name: Self tests
        run: |
          B=.build/debug/Hanasu
          $B --test-saved-templates
          $B --test-speaker-names
          $B --test-dictionary
          # 確かめ方: REQ-DIC-075（画面は撮らず AI も呼ばない。共有の例 common/testdata/logic/screen-terms.json を読む）
          $B --test-screen-dictionary
          $B --test-paste-target
          # 確かめ方: REQ-REL-010, REQ-REL-011（通信しない。版の比べ方・リリースの読み方・スキップ・ホストの制限）
          $B --update-selftest

      # デバッグで通っても、最適化ビルドでだけ落ちることがある（PR #39）
      - name: Release build
        shell: bash
        run: |
          if ! swift build -c release > build-release.log 2>&1; then
            grep -n -B2 -A8 'error:' build-release.log | head -300
            tail -40 build-release.log
            exit 1
          fi
          tail -40 build-release.log
