# Windows 版（windows/）のビルド・テスト・配布物の作成。
# windows/ を触る PR と、main への push で動く。リリースへの添付は tagpr.yml が受け持つ（ここでは artifact に残すだけ）。
name: windows
on:
  pull_request:
    paths:
      - "windows/**"
      # Windows 版も同じプロンプトの JSON を埋め込む（DEC-COM-160）
      - "Sources/Hanasu/Resources/Prompts/**"
      # hanasu コマンドの共有の文（DEC-COM-191）と、Mac と比べる共有のテストデータ（DEC-COM-192）
      - "Sources/Hanasu/Resources/Command/**"
      - "common/testdata/cli/**"
      # 画面から辞書の候補を探すの、Mac と Windows で共有する例（DEC-DIC-234・237）
      - "common/testdata/logic/**"
      - ".github/workflows/windows.yml"
      - "scripts/llama-cpp.lock"
      - "scripts/fetch-llama-cpp.ps1"
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      # 設計判断: DEC-COM-150
      # packages.lock.json と食い違えば失敗させる（Directory.Build.props も CI=true で locked mode にする）
      - name: Restore
        run: dotnet restore Hanasu.Windows.sln --locked-mode

      - name: Build
        run: dotnet build Hanasu.Windows.sln -c Release --no-restore

      - name: Test
        run: dotnet test Hanasu.Core.Tests/Hanasu.Core.Tests.csproj -c Release --no-build --logger "console;verbosity=normal"

      # publish は RID（win-x64）と ILLink を足して restore し直すので、lock ファイル（RID なしで作る）とは入力が合わない。
      # 依存の版とハッシュは上の Restore（locked mode）で確かめてあるので、ここでは locked mode を外す
      - name: Publish (win-x64, self-contained, single file)
        run: dotnet publish Hanasu.Windows/Hanasu.Windows.csproj -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -p:RestoreLockedMode=false -o publish/win-x64

      # 要件: REQ-COM-180
      # 設計判断: DEC-COM-193
      # 利用者向けの hanasu コマンド（cli\hanasu.exe）。PATH に入れるフォルダなので、hanasu.exe だけを置く
      - name: Publish hanasu (cli)
        run: dotnet publish Hanasu.Command/Hanasu.Command.csproj -c Release -r win-x64 --self-contained -p:PublishReadyToRun=true -p:PublishSingleFile=true -p:RestoreLockedMode=false -o publish/win-x64/cli

      # 設計判断: DEC-COM-061
      # ローカルの LLM の llama-server（llama.cpp）を、SHA-256 を確かめてから llama/ に入れる
      - name: Add llama-server
        shell: pwsh
        run: ../scripts/fetch-llama-cpp.ps1 -Destination publish/win-x64

      - name: Check publish output
        shell: pwsh
        run: |
          $expected = @(
            "publish/win-x64/Hanasu.exe",
            "publish/win-x64/sherpa-onnx-c-api.dll",
            "publish/win-x64/onnxruntime.dll",
            "publish/win-x64/runtimes/win-x64/whisper.dll",
            "publish/win-x64/runtimes/win-x64/ggml-whisper.dll",
            "publish/win-x64/runtimes/win-x64/ggml-base-whisper.dll",
            "publish/win-x64/runtimes/win-x64/ggml-cpu-whisper.dll",
            # 確かめ方: REQ-REL-005
            "publish/win-x64/LICENSE.txt",
            "publish/win-x64/LICENSE-ADDITIONAL-PERMISSION.md",
            "publish/win-x64/NOTICE.txt",
            "publish/win-x64/THIRD_PARTY_NOTICES.md",
            "publish/win-x64/dotnet-THIRD-PARTY-NOTICES.txt",
            # 確かめ方: REQ-COM-030
            "publish/win-x64/llama/llama-server.exe",
            "publish/win-x64/llama/llama-server-impl.dll",
            "publish/win-x64/llama/llama.dll",
            "publish/win-x64/llama/ggml-base.dll",
            # 確かめ方: REQ-COM-180
            "publish/win-x64/cli/hanasu.exe"
          )
          foreach ($path in $expected) {
            if (-not (Test-Path $path)) { throw "見つかりません: $path" }
          }
          # 設計判断: DEC-COM-193（PATH に入れる cli\ に、ほかの DLL を混ぜない）
          $cli = @(Get-ChildItem publish/win-x64/cli | ForEach-Object Name)
          if ($cli.Count -ne 1 -or $cli[0] -ne "hanasu.exe") { throw "cli\ に hanasu.exe 以外があります: $($cli -join ', ')" }
          # 確かめ方: REQ-REL-005
          # GPL-3.0 の espeak-ng を含む DLL を配らない（sherpa-onnx 1.13.8 の TTS 付きの DLL に静的にリンクされていた）。
          # 大文字と小文字を区別する（"OfflineSpeakerDiarization" や "wespeaker" に当たらないように）
          $latin1 = [System.Text.Encoding]::Latin1
          foreach ($dll in Get-ChildItem -Recurse publish/win-x64 -Filter *.dll) {
            $text = $latin1.GetString([System.IO.File]::ReadAllBytes($dll.FullName))
            foreach ($marker in @("espeak_ng_", "espeak_Initialize")) {
              if ($text.Contains($marker, [System.StringComparison]::Ordinal)) { throw "GPL-3.0 の espeak-ng が入っています: $($dll.FullName)（$marker）" }
            }
          }
          Get-ChildItem -Recurse publish/win-x64 | Select-Object FullName, Length | Format-Table -AutoSize

      # 確かめ方: REQ-COM-180, REQ-COM-181, REQ-COM-189, REQ-MTG-120
      # 設計判断: DEC-COM-195
      # publish した cli\hanasu.exe を動かす（共有の架空の会議・MCP の手順・コードページを変えたコンソールでのパイプとファイル）
      - name: Run hanasu
        shell: pwsh
        run: |
          $exe = (Resolve-Path publish/win-x64/cli/hanasu.exe).Path
          $env:HANASU_MEETINGS_DIR = (Resolve-Path ../common/testdata/cli/meetings).Path
          [Console]::OutputEncoding = [Text.UTF8Encoding]::new()
          $version = & $exe --version
          if ($LASTEXITCODE -ne 0 -or $version -notlike "hanasu *") { throw "--version: $version" }
          $list = & $exe meetings list --json | Out-String | ConvertFrom-Json
          if ($list.meetings.Count -ne 4 -or $list.unreadableMeetingCount -ne 0 -or $list.meetings[3].title -ne "予算の定例") { throw "meetings list: $($list | ConvertTo-Json -Depth 5)" }
          $search = & $exe meetings search ガイド --json | Out-String | ConvertFrom-Json
          if ($search.results.Count -ne 1) { throw "meetings search: $($search | ConvertTo-Json -Depth 6)" }
          & $exe meetings show 2020-01-01_0000 2>$null
          if ($LASTEXITCODE -ne 4) { throw "ない会議は 4: $LASTEXITCODE" }
          & $exe refine テスト --ai apple 2>$null
          if ($LASTEXITCODE -ne 2) { throw "--ai apple は 2: $LASTEXITCODE" }
          # MCP: stdout の各行が JSON-RPC
          $requests = @(
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}',
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}',
            '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"list_meetings","arguments":{"limit":2}}}'
          ) -join "`n"
          $lines = $requests | & $exe mcp 2>$null
          if ($lines.Count -ne 3) { throw "mcp: $lines" }
          foreach ($line in $lines) { $null = $line | ConvertFrom-Json }
          # コードページを変えたコンソール（日本語 932・英語 437）でも、ファイルは UTF-8 の JSON、cmd の echo からのパイプは化けない
          foreach ($cp in 932, 437) {
            cmd /c "chcp $cp >nul && `"$exe`" meetings list --json > out-$cp.json"
            $json = [IO.File]::ReadAllText("out-$cp.json", [Text.UTF8Encoding]::new($false, $true)) | ConvertFrom-Json
            if ($json.meetings[3].title -ne "予算の定例") { throw "chcp $cp のファイル: $($json.meetings[3].title)" }
          }
          cmd /c "chcp 932 >nul && echo 予算の定例| `"$exe`" dict apply --json > dict-932.json"
          $dict = [IO.File]::ReadAllText("dict-932.json", [Text.UTF8Encoding]::new($false, $true)) | ConvertFrom-Json
          if ($dict.text -ne "予算の定例") { throw "chcp 932 の echo: $($dict.text)" }

      # 確かめ方: REQ-COM-185（W7。架空の会議 1,000 件で、3 回のうちいちばん速い値が 2 秒以内）
      - name: Measure hanasu speed
        shell: pwsh
        run: |
          $exe = (Resolve-Path publish/win-x64/cli/hanasu.exe).Path
          $dir = Join-Path $env:RUNNER_TEMP "hanasu-bench"
          New-Item -ItemType Directory -Force $dir | Out-Null
          $sb = [Text.StringBuilder]::new()
          for ($u = 0; $u -lt 600; $u++) {
            if ($u -gt 0) { [void]$sb.Append(",") }
            [void]$sb.Append('{"id":"00000000-0000-4000-8000-' + $u.ToString("000000000000") + '","speaker":"spk' + ($u % 3) + '","start":' + ($u * 5) + ',"end":' + ($u * 5 + 4) + ',"text":"架空の発言です。予算と日程について話しています。番号 ' + $u + '"}')
          }
          $utterances = $sb.ToString()
          $start = [DateTime]::new(2025, 1, 1, 0, 0, 0, [DateTimeKind]::Utc)
          for ($i = 0; $i -lt 1000; $i++) {
            $at = $start.AddHours($i * 7)
            $id = $at.ToString("yyyy-MM-dd HHmm")
            $folder = Join-Path $dir $id
            New-Item -ItemType Directory -Force $folder | Out-Null
            $json = '{"id":"' + $id + '","title":"架空の会議 ' + $i + '","startedAt":"' + $at.ToString("yyyy-MM-ddTHH:mm:ssZ") + '","duration":3000,"status":"done","speakerNames":{},"utterances":[' + $utterances + '],"minutes":"# 架空の会議 — 議事録\n\n- 予算を確認する"}'
            [IO.File]::WriteAllText((Join-Path $folder "meeting.json"), $json)
          }
          $env:HANASU_MEETINGS_DIR = $dir
          # 上限は一覧と表示が 2 秒、検索が 3 秒（全部の発言を読んで調べる。DEC-MTG-123。CI の機械では起動だけで 0.9 秒ほどかかる）
          $limits = @{ "list" = 2; "show" = 2; "search" = 3 }
          foreach ($command in @(@("meetings", "list", "--json"), @("meetings", "show", "latest", "--json"), @("meetings", "search", "予算", "--json"))) {
            $best = [double]::MaxValue
            for ($run = 0; $run -lt 3; $run++) {
              $elapsed = (Measure-Command { & $exe @command | Out-Null }).TotalSeconds
              $best = [Math]::Min($best, $elapsed)
            }
            Write-Output ("hanasu {0}: {1:N2} s" -f ($command -join " "), $best)
            $limit = $limits[$command[1]]
            if ($best -gt $limit) { throw "hanasu $($command -join ' ') が $limit 秒を超えました: $best" }
          }

      # 確かめ方: REQ-DIC-075
      # 設計判断: DEC-DIC-234, DEC-DIC-235, DEC-DIC-237
      # publish した Hanasu.exe の --dump-screen-text を、CI の画面で動かす。
      # 既定の除外（KeePassXC）の名前にした notepad のウインドウの文字が出ないこと、日本語の行が空白なしでつながって出ることを見る。
      # 対照として、同じ文字を名前を変えない notepad で開くと読めることも見る（読めなければ、除外ではなく撮れていないだけ）。
      # CI の画面で撮れない・ウインドウが出ない・OCR や日本語のフォントを入れられないことがありうるので、失敗してもジョブは落とさず、結果をログに出す
      - name: Dump screen text
        shell: pwsh
        continue-on-error: true
        run: |
          $exe = (Resolve-Path publish/win-x64/Hanasu.exe).Path
          $temp = $env:RUNNER_TEMP
          # 日本語の OCR と、日本語のフォント（なければ notepad が日本語を描けない）を入れる
          foreach ($name in @("Language.OCR~~~ja-JP~0.0.1.0", "Language.Fonts.Jpan~~~und-JPAN~0.0.1.0")) {
            $capability = Get-WindowsCapability -Online -Name $name
            Write-Output "$name : $($capability.State)"
            if ($capability.State -ne "Installed") { Add-WindowsCapability -Online -Name $name | Out-Null }
          }
          # 文字起こしの言語を日本語にした設定で読む（OCR の言語は文字起こしの言語に合わせる）
          $settingsDir = Join-Path $env:APPDATA "Hanasu"
          New-Item -ItemType Directory -Force $settingsDir | Out-Null
          Set-Content -Path (Join-Path $settingsDir "settings.json") -Value '{ "localeIdentifier": "ja-JP" }' -Encoding utf8
          Add-Type -Namespace HanasuCi -Name Native -MemberDefinition '[DllImport("user32.dll")] public static extern bool MoveWindow(System.IntPtr hwnd, int x, int y, int width, int height, bool repaint);'
          function Open-Notepad([string] $path, [string] $file, [int] $y) {
            $process = Start-Process -FilePath $path -ArgumentList "`"$file`"" -PassThru
            for ($i = 0; $i -lt 50 -and $process.MainWindowHandle -eq 0; $i++) { Start-Sleep -Milliseconds 200; $process.Refresh() }
            if ($process.MainWindowHandle -eq 0) { throw "ウインドウが出ません: $path" }
            [HanasuCi.Native]::MoveWindow($process.MainWindowHandle, 0, $y, 900, 300, $true) | Out-Null
            return $process
          }
          function Dump-ScreenText([string] $out) {
            Start-Sleep -Seconds 2
            $process = Start-Process -FilePath $exe -ArgumentList "--dump-screen-text", "`"$out`"" -PassThru
            if (-not $process.WaitForExit(180000)) { $process.Kill(); throw "--dump-screen-text が終わりません" }
            $text = if (Test-Path $out) { [IO.File]::ReadAllText($out, [Text.UTF8Encoding]::new($false, $true)) } else { "" }
            # 関数の戻り値に混ざらないよう、ログは Write-Host で出す
            Write-Host "---- $out (exit $($process.ExitCode))"
            Write-Host $text
            if ($process.ExitCode -ne 0) { throw "--dump-screen-text の終了コード: $($process.ExitCode)" }
            $first = ($text -split "`n")[0]
            if ($first -notmatch '^# displays=\d+ language=\S+ fallback=(true|false)$') { throw "1 行目の形が違います: $first" }
            return $text
          }
          # 除外のアプリの代わり: notepad.exe を KeePassXC.exe の名前でコピーする（言語のリソースの .mui も同じ並びでコピーする）
          $fakeDir = Join-Path $temp "fake-keepassxc"
          New-Item -ItemType Directory -Force $fakeDir | Out-Null
          $fake = Join-Path $fakeDir "KeePassXC.exe"
          Copy-Item "$env:WINDIR\System32\notepad.exe" $fake
          foreach ($mui in Get-ChildItem "$env:WINDIR\System32\*\notepad.exe.mui") {
            $dir = Join-Path $fakeDir $mui.Directory.Name
            New-Item -ItemType Directory -Force $dir | Out-Null
            Copy-Item $mui.FullName (Join-Path $dir "KeePassXC.exe.mui")
          }
          $secret = Join-Path $temp "secret.txt"
          $japanese = Join-Path $temp "japanese.txt"
          Set-Content -Path $secret -Value "HANASU-SECRET-7Q" -Encoding utf8BOM
          Set-Content -Path $japanese -Value "株式会社ストックマーク" -Encoding utf8BOM
          $keepass = Open-Notepad $fake $secret 0
          $notepad = Open-Notepad "notepad.exe" $japanese 360
          $masked = Dump-ScreenText (Join-Path $temp "screen-masked.txt")
          $failures = @()
          if ($masked.Contains("SECRET")) { $failures += "除外したウインドウ（KeePassXC.exe）の文字が出ました" }
          if (-not $masked.Contains("株式会社ストックマーク")) { $failures += "日本語の行が空白なしでつながって出ていません" }
          # 対照: 同じ文字を、名前を変えない notepad で同じ場所に開くと読める
          Stop-Process -Id $keepass.Id -Force
          $plain = Open-Notepad "notepad.exe" $secret 0
          $visible = Dump-ScreenText (Join-Path $temp "screen-visible.txt")
          if (-not $visible.Contains("HANASU-SECRET")) { $failures += "対照の notepad の文字が読めません（撮れていないため、除外を確かめられません）" }
          Stop-Process -Id $plain.Id, $notepad.Id -Force -ErrorAction SilentlyContinue
          if ($failures.Count -gt 0) { throw ($failures -join "`n") }
          Write-Output "--dump-screen-text: 除外と日本語のつなぎ方を確かめました"

      - name: Zip
        shell: pwsh
        run: |
          Compress-Archive -Path publish/win-x64/* -DestinationPath publish/Hanasu-windows-x64.zip
          # 配る zip の SHA-256 を残す（ダウンロードした人が確かめられるように）
          $hash = (Get-FileHash publish/Hanasu-windows-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Hanasu-windows-x64.zip" | Out-File -Encoding ascii publish/Hanasu-windows-x64.zip.sha256
          Write-Output "SHA-256: $hash"

      - uses: actions/upload-artifact@v4
        with:
          name: Hanasu-windows-x64
          path: |
            windows/publish/Hanasu-windows-x64.zip
            windows/publish/Hanasu-windows-x64.zip.sha256
          if-no-files-found: error
