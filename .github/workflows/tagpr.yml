# main への push ごとに tagpr がリリース PR を作り・更新する。
# リリース PR をマージすると tagpr がタグと下書きのリリースを作り、続く release ジョブが
# macOS でアプリをビルドして dmg を添付し、リリースを公開する。
# 既存のタグの dmg を作り直したいときは、Actions から tag を指定して手動で実行する。
name: tagpr
on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      tag:
        description: "dmg を作り直すタグ（例: v1.1.0）"
        required: true

permissions:
  contents: write
  pull-requests: write
  issues: read

jobs:
  tagpr:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tagpr.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - id: tagpr
        uses: Songmu/tagpr@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release:
    needs: tagpr
    # 手動実行では tagpr を飛ばすので、飛ばされても動くようにする
    if: ${{ !cancelled() && !failure() && (needs.tagpr.outputs.tag != '' || inputs.tag != '') }}
    runs-on: macos-26
    permissions:
      contents: write
    env:
      TAG: ${{ needs.tagpr.outputs.tag || inputs.tag }}
      # scripts/setup-release-signing.sh で登録する（なければアドホック署名になる）
      SIGNING_CERT_P12: ${{ secrets.MACOS_SIGNING_CERT_P12 }}
      SIGNING_CERT_PASSWORD: ${{ secrets.MACOS_SIGNING_CERT_PASSWORD }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.tagpr.outputs.tag || inputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Import signing certificate
        if: env.SIGNING_CERT_P12 != ''
        run: |
          ./scripts/ci-import-signing-cert.sh
          echo "SIGN_IDENTITY=Hanasu Release Signing" >> "$GITHUB_ENV"

      - name: Build
        run: |
          swift --version
          ./scripts/build-app.sh
          codesign -dvv build/Hanasu.app 2>&1 | grep -E "Identifier|Authority|Signature" || true

      - name: Make dmg
        run: |
          # dmg 化より前のタグを作り直すときは、ワークフローと同じコミットのスクリプトを使う
          if [[ ! -f scripts/make-dmg.sh ]]; then
            git show "$GITHUB_SHA:scripts/make-dmg.sh" > scripts/make-dmg.sh
            chmod +x scripts/make-dmg.sh
          fi
          ./scripts/make-dmg.sh

      - name: Upload and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${TAG#v}"
          DMG="build/Hanasu-${VERSION}.dmg"
          SHA256="$(shasum -a 256 "$DMG" | awk '{print $1}')"
          gh release upload "$TAG" "$DMG" --clobber
          # 以前の版は zip で配っていたので、作り直したときは消す
          gh release delete-asset "$TAG" "Hanasu-${VERSION}.zip" --yes 2>/dev/null || true
          # 作り直したときに二重にならないよう、前回付けたインストール手順から後ろを除いてから付け直す
          gh release view "$TAG" --json body --jq .body | awk '/^## インストール$/ {exit} {print}' > build/notes.md
          {
            echo
            echo "## インストール"
            echo
            echo "1. \`Hanasu-${VERSION}.dmg\` を開き、\`Hanasu.app\` を「Applications」フォルダにドラッグします。"
            echo "2. Apple の公証を受けていない自己署名のアプリなので、初回は開けない旨の確認が出ます。「完了」を押してから、システム設定 → プライバシーとセキュリティ の下にある「このまま開く」を押してください（またはターミナルで \`xattr -dr com.apple.quarantine /Applications/Hanasu.app\` を実行してから開きます）。"
            echo "3. macOS 26 (Tahoe) 以降、Apple Silicon が必要です。詳しくは [README](https://github.com/${GITHUB_REPOSITORY}#readme) を見てください。"
            echo
            echo "SHA-256 (Hanasu-${VERSION}.dmg): \`${SHA256}\`"
          } >> build/notes.md
          gh release edit "$TAG" --notes-file build/notes.md --draft=false
