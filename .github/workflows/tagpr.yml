# main への push ごとに tagpr がリリース PR を作り・更新する。
# リリース PR をマージすると tagpr がタグと下書きのリリースを作る。続けて
#   - mac ジョブ: macOS でアプリをビルドして zip を添付する
#   - windows ジョブ: Windows 版をビルドして zip を添付する（windows/ がないタグでは何もしない）
#   - publish ジョブ: インストール手順と SHA-256 をリリースノートに足して公開する
# 既存のタグの添付ファイルを作り直したいときは、Actions から tag を指定して手動で実行する。
# 設計判断: DEC-REL-002
name: tagpr
on:
  push:
    branches: ["main"]
  # 設計判断: DEC-REL-006
  workflow_dispatch:
    inputs:
      tag:
        description: "添付ファイルを作り直すタグ（例: v1.3.0）"
        required: true

permissions:
  contents: write
  pull-requests: write
  issues: read

jobs:
  # 要件: REQ-REL-001
  tagpr:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tagpr.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - id: tagpr
        uses: Songmu/tagpr@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 要件: REQ-REL-002, REQ-REL-003
  mac:
    needs: tagpr
    # 手動実行では tagpr を飛ばすので、飛ばされても動くようにする
    if: ${{ !cancelled() && !failure() && (needs.tagpr.outputs.tag != '' || inputs.tag != '') }}
    runs-on: macos-26
    permissions:
      contents: write
    outputs:
      asset: ${{ steps.upload.outputs.asset }}
      sha256: ${{ steps.upload.outputs.sha256 }}
    env:
      TAG: ${{ needs.tagpr.outputs.tag || inputs.tag }}
      # scripts/setup-release-signing.sh で登録する（なければアドホック署名になる）
      SIGNING_CERT_P12: ${{ secrets.MACOS_SIGNING_CERT_P12 }}
      SIGNING_CERT_PASSWORD: ${{ secrets.MACOS_SIGNING_CERT_PASSWORD }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.tagpr.outputs.tag || inputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Import signing certificate
        if: env.SIGNING_CERT_P12 != ''
        run: |
          ./scripts/ci-import-signing-cert.sh
          echo "SIGN_IDENTITY=Hanasu Release Signing" >> "$GITHUB_ENV"

      - name: Build
        run: |
          swift --version
          ./scripts/build-app.sh
          codesign -dvv build/Hanasu.app 2>&1 | grep -E "Identifier|Authority|Signature" || true

      - name: Upload zip
        id: upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${TAG#v}"
          ASSET="Hanasu-${VERSION}-macOS.zip"
          # 設計判断: DEC-REL-003
          # ditto で固めると、署名と拡張属性を保ったまま Finder で展開できる
          ditto -c -k --keepParent build/Hanasu.app "build/${ASSET}"
          gh release upload "$TAG" "build/${ASSET}" --clobber
          echo "asset=${ASSET}" >> "$GITHUB_OUTPUT"
          echo "sha256=$(shasum -a 256 "build/${ASSET}" | awk '{print $1}')" >> "$GITHUB_OUTPUT"

  # 要件: REQ-REL-004
  # 設計判断: DEC-REL-004
  windows:
    needs: tagpr
    if: ${{ !cancelled() && !failure() && (needs.tagpr.outputs.tag != '' || inputs.tag != '') }}
    runs-on: windows-latest
    permissions:
      contents: write
    outputs:
      asset: ${{ steps.upload.outputs.asset }}
      sha256: ${{ steps.upload.outputs.sha256 }}
    env:
      TAG: ${{ needs.tagpr.outputs.tag || inputs.tag }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.tagpr.outputs.tag || inputs.tag }}
          persist-credentials: false

      - name: Check Windows project
        id: check
        run: |
          # Windows 版より前のタグでは何もしない
          $has = Test-Path windows/Hanasu.Windows/Hanasu.Windows.csproj
          "exists=$($has.ToString().ToLower())" >> $env:GITHUB_OUTPUT

      - uses: actions/setup-dotnet@v4
        if: steps.check.outputs.exists == 'true'
        with:
          dotnet-version: "8.0.x"

      # 設計判断: DEC-COM-150
      # 依存の版とハッシュは、ここで packages.lock.json と照らし合わせる（食い違えば失敗させる）
      - name: Restore
        if: steps.check.outputs.exists == 'true'
        run: dotnet restore windows/Hanasu.Windows.sln --locked-mode

      # publish は RID（win-x64）と ILLink を足して restore し直すので、lock ファイル（RID なしで作る）とは入力が合わない。
      # 上の Restore で確かめてあるので、ここでは locked mode を外す（windows.yml と同じ）
      - name: Publish
        if: steps.check.outputs.exists == 'true'
        run: |
          $version = $env:TAG.TrimStart('v')
          dotnet publish windows/Hanasu.Windows/Hanasu.Windows.csproj -c Release -r win-x64 --self-contained `
            -p:PublishSingleFile=true -p:RestoreLockedMode=false -p:Version=$version -o build/windows/Hanasu
          # 要件: REQ-COM-180
          # 設計判断: DEC-COM-193（利用者向けの hanasu コマンド。cli\ には hanasu.exe だけを置く）
          dotnet publish windows/Hanasu.Command/Hanasu.Command.csproj -c Release -r win-x64 --self-contained -p:PublishReadyToRun=true `
            -p:PublishSingleFile=true -p:RestoreLockedMode=false -p:Version=$version -o build/windows/Hanasu/cli
          $cli = @(Get-ChildItem build/windows/Hanasu/cli | ForEach-Object Name)
          if ($cli.Count -ne 1 -or $cli[0] -ne "hanasu.exe") { throw "cli\ に hanasu.exe 以外があります: $($cli -join ', ')" }

      # 要件: REQ-COM-030
      # 設計判断: DEC-COM-061
      # ローカルの LLM の llama-server（llama.cpp）を、SHA-256 を確かめてから llama/ に入れる
      - name: Add llama-server
        if: steps.check.outputs.exists == 'true'
        run: ./scripts/fetch-llama-cpp.ps1 -Destination build/windows/Hanasu

      - name: Upload zip
        id: upload
        if: steps.check.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = $env:TAG.TrimStart('v')
          $asset = "Hanasu-$version-Windows-x64.zip"
          Compress-Archive -Path build/windows/Hanasu -DestinationPath "build/$asset" -Force
          gh release upload $env:TAG "build/$asset" --clobber
          $sha = (Get-FileHash -Algorithm SHA256 "build/$asset").Hash.ToLower()
          "asset=$asset" >> $env:GITHUB_OUTPUT
          "sha256=$sha" >> $env:GITHUB_OUTPUT

  # 設計判断: DEC-REL-001, DEC-REL-005
  publish:
    needs: [tagpr, mac, windows]
    if: ${{ !cancelled() && needs.mac.result == 'success' && needs.windows.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.tagpr.outputs.tag || inputs.tag }}
      MAC_ASSET: ${{ needs.mac.outputs.asset }}
      MAC_SHA256: ${{ needs.mac.outputs.sha256 }}
      WIN_ASSET: ${{ needs.windows.outputs.asset }}
      WIN_SHA256: ${{ needs.windows.outputs.sha256 }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      # 要件: REQ-REL-006
      # 設計判断: DEC-REL-010
      # リリース文（docs/releases/<タグ>.md）と組み立てのスクリプトを、タグの時点のものから読む
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.tagpr.outputs.tag || inputs.tag }}
          persist-credentials: false
          sparse-checkout: |
            docs/releases
            scripts/compose-release-notes.py
          sparse-checkout-cone-mode: false

      - name: Publish release
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body > body.md
          {
            echo "## インストール"
            echo
            echo "### macOS"
            echo
            echo "1. \`${MAC_ASSET}\` を展開し、\`Hanasu.app\` を「アプリケーション」フォルダに入れます。"
            echo "2. Apple の公証を受けていない自己署名のアプリなので、初回は開けない旨の確認が出ます。「完了」を押してから、システム設定 → プライバシーとセキュリティ の下にある「このまま開く」を押してください（またはターミナルで \`xattr -dr com.apple.quarantine /Applications/Hanasu.app\` を実行してから開きます）。"
            echo "3. macOS 26 (Tahoe) 以降、Apple Silicon が必要です。"
            if [[ -n "$WIN_ASSET" ]]; then
              echo
              echo "### Windows"
              echo
              echo "1. \`${WIN_ASSET}\` を展開し、\`Hanasu\` フォルダを好きな場所（例: \`%LOCALAPPDATA%\\Programs\`）に置いて \`Hanasu.exe\` を開きます。"
              echo "2. コード署名をしていないので、初回は SmartScreen の確認が出ます。「詳細情報」→「実行」を押してください。"
              echo "3. Windows 10（2004 以降）/ 11、x64 が必要です。"
              # 要件: REQ-COM-180
              echo "4. ターミナルや AI エージェントからは、同じフォルダの \`cli\\hanasu.exe\` で使えます（設定 →「コマンドと MCP」で PATH に入れられます）。"
            fi
            echo
            echo "詳しくは [README](https://github.com/${GITHUB_REPOSITORY}#readme) を見てください。"
            echo
            echo "SHA-256:"
            echo
            echo "- \`${MAC_ASSET}\`: \`${MAC_SHA256}\`"
            if [[ -n "$WIN_ASSET" ]]; then
              echo "- \`${WIN_ASSET}\`: \`${WIN_SHA256}\`"
            fi
          } > install.md
          # リリース文があれば先頭に入れ、PR の一覧・インストールの順に組み立てる。
          # 作り直したときに二重にならないよう、前に付けたリリース文とインストールの手順は除いてから付け直す
          python3 scripts/compose-release-notes.py --body body.md --install install.md --notes "docs/releases/${TAG}.md" > notes.md
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file notes.md --draft=false
